pypi:
  stage: deploy

  only:
    - tags

  before_script:
  - python3 --version
  - pip3 install -U twine

  script:
  - TWINE_PASSWORD=${PYPI_PUSH} TWINE_USERNAME=PYPI-0 python -m twine upload --verbose --repository-url ${CI_API_V4_URL}/projects/6700/packages/pypi dist/*
