[metadata]
name = zoidberg-w7x
long_description = file: README.md
long_description_content_type = text/markdown
author = Brendan Shahanahan and David Bold
author_email = dave@ipp.mpg.de
description = Generate W7-X grids for BOUT++
license = GPLv3
license_file = LICENSE
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Science/Research
    Intended Audience :: Education
    Intended Audience :: Developers
    License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)
    Natural Language :: English
    Operating System :: POSIX :: Linux
    Programming Language :: Python :: 3.6
    Programming Language :: Python :: 3.7
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Topic :: Scientific/Engineering :: Visualization
project_urls =
    Source = https://gitlab.mpcdf.mpg.de/dave/zoidberg-w7x
    Tracker = https://gitlab.mpcdf.mpg.de/dave/zoidberg-w7x/-/issues

[options]
packages = find:
install_requires =
    boututils
    matplotlib
    numpy
    osa
    scipy
    shapely
    xarray
    zoidberg
    netcdf4
    importlib-metadata; python_version >= "3.6"

[options.entry_points]
console_scripts =
    zoidberg-w7x=zoidberg_w7x.gen_w7x:main
